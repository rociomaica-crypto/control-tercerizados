<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Tercerizados — Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta de marca real, extraída del logo Metalúrgica Vera: Azul #074494, Verde #00963F */
  --ink:#131B22;
  --ink-soft:#565F63;
  --steel:#3E6FAE;
  --steel-dark:#074494;
  --steel-pale:#DCE6F4;
  --accent:#00963F;
  --accent-dark:#1B5233;
  --paper:#EAF4EC;
  --paper-raised:#FFFFFF;
  --line:#D2D7D6;
  --line-soft:#E6E9E8;
  --amber:#F0A202;
  --amber-pale:#FCE7C0;
  --oxide:#E1392B;
  --oxide-pale:#FAD7D2;
  --green:#00963F;
  --green-pale:#DCF1E4;
  --gris:#8F9696;
  --gris-pale:#E4E7E7;
  --radius:3px;
  --shadow:0 1px 2px rgba(7,68,148,0.08), 0 4px 14px rgba(7,68,148,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Work Sans',sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.45;
}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,h4{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.02em;
  margin:0;
  color:var(--ink);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}
a{color:var(--steel);}

/* ===== App shell ===== */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--steel-dark);
  color:#fff;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:28px;
  height:56px;
  flex-shrink:0;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:19px;letter-spacing:0.03em;text-transform:uppercase;
  padding-right:20px;border-right:1px solid rgba(255,255,255,0.18);
}
.brand .mark{
  width:26px;height:26px;border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  color:var(--accent);flex-shrink:0;
}
.tabs{display:flex;gap:2px;height:100%;}
.tab-btn{
  background:none;border:none;color:rgba(255,255,255,0.65);
  padding:0 16px;height:100%;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.04em;
  border-bottom:2px solid transparent;
  transition:color .15s;
}
.tab-btn:hover{color:#fff;}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent);}
.tab-btn .badge{
  display:inline-block;margin-left:6px;background:var(--oxide);color:#fff;
  border-radius:8px;font-size:10px;padding:1px 6px;font-family:'IBM Plex Mono',monospace;
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.55);}

main{flex:1;padding:22px 26px 60px;max-width:1360px;margin:0 auto;width:100%;}

/* ===== Cards / sections ===== */
.card{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
  gap:12px;flex-wrap:wrap;
}
.section-head h2{font-size:18px;}
.section-head .sub{font-size:12px;color:var(--ink-soft);text-transform:none;letter-spacing:0;font-weight:400;font-family:'Work Sans',sans-serif;margin-top:2px;}
.section-body{padding:18px;}

.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

/* ===== KPI cards ===== */
.kpi{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--steel);}
.kpi.amber::before{background:var(--amber);}
.kpi.oxide::before{background:var(--oxide);}
.kpi.green::before{background:var(--green);}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:600;}
.kpi .value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:6px;color:var(--ink);}
.kpi .foot{font-size:11px;color:var(--ink-soft);margin-top:4px;}

/* ===== Buttons ===== */
.btn{
  border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);
  padding:8px 14px;border-radius:var(--radius);font-size:12.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.03em;display:inline-flex;align-items:center;gap:6px;
  transition:all .12s;
}
.btn:hover{border-color:var(--steel);color:var(--steel-dark);}
.btn-primary{background:var(--steel-dark);border-color:var(--steel-dark);color:#fff;}
.btn-primary:hover{background:var(--steel);border-color:var(--steel);color:#fff;}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#fff;}
.btn-amber:hover{background:#c07a24;border-color:#c07a24;color:#fff;}
.btn-ghost{border-color:transparent;background:none;}
.btn-ghost:hover{background:var(--line-soft);}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-danger{color:var(--oxide);border-color:var(--oxide-pale);}
.btn-danger:hover{background:var(--oxide-pale);border-color:var(--oxide);}

/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--ink-soft);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--paper);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAF9F5;}
.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
.tright{text-align:right;}

/* ===== Progress bar (ruler style) ===== */
.gauge{height:8px;background:var(--line-soft);border-radius:2px;position:relative;overflow:hidden;border:1px solid var(--line);}
.gauge > div{height:100%;background:var(--steel);}
.gauge.over > div{background:var(--oxide);}
.gauge.ok > div{background:var(--green);}
.gauge-row{display:flex;align-items:center;gap:8px;}
.gauge-row .gauge{flex:1;}
.gauge-row .pct{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;min-width:40px;text-align:right;}

/* ===== Pills / status ===== */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;
  font-family:'IBM Plex Mono',monospace;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.pendiente{background:var(--oxide-pale);color:var(--oxide);}
.pill.reservado{background:var(--amber-pale);color:#8c5f1c;}
.pill.pagado{background:var(--green-pale);color:var(--green);}
.pill.activo{background:var(--steel-pale);color:var(--steel-dark);}
.pill.finalizado{background:var(--green-pale);color:var(--green);}
.pill.suspendido{background:var(--oxide-pale);color:var(--oxide);}

/* ===== Ficha técnica (signature header) ===== */
.ficha{
  background:var(--steel-dark);color:#fff;border-radius:var(--radius);
  padding:0;overflow:hidden;
}
.ficha-top{padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.14);}
.ficha-top h1{color:#fff;font-size:26px;}
.ficha-top .client{color:var(--amber);font-size:13px;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-top:3px;}
.ficha-fields{display:flex;flex-wrap:wrap;gap:0;background:rgba(0,0,0,0.15);}
.ficha-field{
  padding:10px 18px;border-right:1px solid rgba(255,255,255,0.12);
  min-width:120px;
}
.ficha-field .k{font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.55);font-weight:600;}
.ficha-field .v{font-family:'IBM Plex Mono',monospace;font-size:13.5px;margin-top:2px;color:#fff;}

/* ===== Forms / modal ===== */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--steel);outline-offset:-1px;border-color:var(--steel);}
.field-row{display:flex;gap:12px;}
.field-row > .field{flex:1;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(28,34,38,0.55);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
}
.modal{
  background:var(--paper-raised);border-radius:var(--radius);width:100%;max-width:640px;
  box-shadow:0 12px 40px rgba(0,0,0,0.3);
}
.modal.wide{max-width:920px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.x-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
.x-close:hover{color:var(--oxide);}

/* ===== Empty state ===== */
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty .glyph{font-size:28px;margin-bottom:8px;}
.empty p{margin:4px 0 14px;font-size:13px;}

/* ===== Obra card list ===== */
.obra-card{
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:16px;
  cursor:pointer;transition:box-shadow .12s, border-color .12s;
}
.obra-card:hover{border-color:var(--steel);box-shadow:var(--shadow);}
.obra-card .ot{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);font-weight:600;}
.obra-card h3{font-size:19px;margin-top:2px;}
.obra-card .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.obra-card .stats{display:flex;gap:18px;margin-top:12px;}
.obra-card .stat .k{font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.04em;}
.obra-card .stat .v{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}

/* ===== Contract card ===== */
.contrato-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:14px;overflow:hidden;}
.contrato-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);cursor:pointer;}
.contrato-head:hover{background:#EEEAE0;}
.contrato-head .name{font-weight:600;font-size:14.5px;}
.contrato-head .rubro{font-size:11.5px;color:var(--ink-soft);}
.contrato-detail{padding:16px;border-top:1px solid var(--line-soft);display:none;}
.contrato-detail.open{display:block;}
.contrato-meta{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;}
.contrato-meta .k{color:var(--ink-soft);text-transform:uppercase;font-size:10px;letter-spacing:.04em;}
.contrato-meta .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;}

/* ===== calendar ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{font-size:10px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:4px 0;font-weight:700;letter-spacing:.04em;}
.cal-cell{
  min-height:78px;border:1px solid var(--line-soft);border-radius:2px;padding:5px 6px;background:#fff;
  font-size:11px;position:relative;
}
.cal-cell.empty{background:transparent;border:none;}
.cal-cell.today{border-color:var(--amber);border-width:2px;}
.cal-cell .dnum{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink-soft);}
.cal-pay{
  margin-top:4px;padding:2px 5px;border-radius:2px;font-size:10px;cursor:pointer;
  background:var(--oxide-pale);color:var(--oxide);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cal-pay.reservado{background:var(--amber-pale);color:#8c5f1c;}
.cal-pay.pagado{background:var(--green-pale);color:var(--green);}

/* ===== toast ===== */
#toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;
  border-radius:var(--radius);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:200;
  opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0);}

.link-btn{background:none;border:none;color:var(--steel);font-weight:600;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.small-note{font-size:11px;color:var(--ink-soft);font-style:italic;}
.tag-unit{font-size:10px;background:var(--steel-pale);color:var(--steel-dark);padding:1px 6px;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:4px 7px;font-size:12px;color:var(--ink-soft);}
.icon-btn:hover{border-color:var(--oxide);color:var(--oxide);}
#loading{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:999;}
#loading .spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--steel);border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const res = await window.storage.get(key, false);
      if(res && res.value) return res.value;
      return null;
    }
  }catch(e){ /* clave inexistente o storage no disponible acá: seguimos con localStorage */ }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let okCloud = false;
  try{
    if(window.storage && typeof window.storage.set==='function'){
      const res = await window.storage.set(key, value, false);
      okCloud = !!res;
    }
  }catch(e){ okCloud = false; }
  let okLocal = false;
  try{ localStorage.setItem(key, value); okLocal = true; }catch(e){ okLocal = false; }
  return okCloud || okLocal;
}

function supabaseConfigured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
function supaHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  }, extra||{});
}
async function cloudGet(){
  const base = SUPABASE_URL.replace(/\/$/,'');
  const res = await fetch(`${base}/rest/v1/estado_app?id=eq.1&select=data`, {headers: supaHeaders()});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  return (json && json[0]) ? json[0].data : null;
}
async function cloudSet(dataObj){
  const base = SUPABASE_URL.replace(/\/$/,'');
  const res = await fetch(`${base}/rest/v1/estado_app?id=eq.1`, {
    method:'PATCH',
    headers: supaHeaders({'Content-Type':'application/json','Prefer':'return=minimal'}),
    body: JSON.stringify({data:dataObj, updated_at:new Date().toISOString()})
  });
  return res.ok;
}

async function loadState(){
  if(supabaseConfigured()){
    try{
      const cloud = await cloudGet();
      if(cloud && Object.keys(cloud).length){
        STATE = cloud;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        return;
      }
    }catch(e){ console.warn('No se pudo leer de Supabase, uso copia local', e); }
  }
  try{
    const value = await storageGet(STORAGE_KEY);
    if(value){ STATE = JSON.parse(value); return; }
  }catch(e){ /* dato corrupto o inexistente */ }
  STATE = seedData();
  await saveState();
}
async function saveState(){
  const okLocal = await storageSet(STORAGE_KEY, JSON.stringify(STATE));
  if(supabaseConfigured()){
    try{
      const okCloud = await cloudSet(STATE);
      if(!okCloud) showToast('No se pudo sincronizar con el servidor — se guardó solo en este dispositivo');
    }catch(e){ showToast('Sin conexión con el servidor — se guardó solo en este dispositivo'); }
  } else if(!okLocal){
    showToast('No se pudo guardar — tu navegador está bloqueando el almacenamiento local');
  }
}
async function persist(){ await saveState(); render(); }

let pollTimer=null;
function startPolling(){
  if(!supabaseConfigured()) return;
  pollTimer = setInterval(async ()=>{
    if(document.getElementById('modalRoot').innerHTML.trim()) return; // no interrumpir edición
    try{
      const cloud = await cloudGet();
      if(cloud && JSON.stringify(cloud)!==JSON.stringify(STATE)){
        STATE = cloud; render(); showToast('Datos actualizados por otro usuario');
      }
    }catch(e){ /* error de red pasajero: ignorar */ }
  }, POLL_MS);
}
async function manualRefresh(){
  if(!supabaseConfigured()){ showToast('Modo local — no hay servidor compartido configurado'); return; }
  try{ const cloud = await cloudGet(); if(cloud){ STATE = cloud; render(); showToast('Actualizado'); } }
  catch(e){ showToast('No se pudo conectar con el servidor'); }
}

/* =========================================================================
   HELPERS DE FORMATO Y CÁLCULO
   ========================================================================= */
const fmtGs = n => 'Gs. ' + Math.round(n||0).toLocaleString('es-PY');
const fmtNum = (n,dec=2) => (n||0).toLocaleString('es-PY',{minimumFractionDigits:dec===0?0:0,maximumFractionDigits:dec});
const fmtDate = d => { if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

function findObra(id){ return STATE.obras.find(o=>o.id===id); }
function findContrato(obra, id){ return obra.contratos.find(c=>c.id===id); }

function contratoValorTotal(c){ return c.items.reduce((s,i)=>s + i.cantidad*i.precio_unitario, 0); }
function contratoValorConIva(c){ return contratoValorTotal(c) * (1 + (c.iva_pct||0)/100); }
function certMontoNeto(c, cert){
  let s=0;
  for(const itemId in cert.detalle){
    const item = c.items.find(i=>i.id===itemId);
    if(item) s += (cert.detalle[itemId]||0) * item.precio_unitario;
  }
  return s;
}
function certMontoTotal(c, cert){ return certMontoNeto(c,cert) * (1+(c.iva_pct||0)/100); }
function contratoCertificadoNeto(c){ return c.certificaciones.reduce((s,ce)=>s+certMontoNeto(c,ce),0); }
function contratoCertificadoTotal(c){ return c.certificaciones.reduce((s,ce)=>s+certMontoTotal(c,ce),0); }
function contratoAvanceFinanciero(c){ const t=contratoValorTotal(c); return t>0 ? (contratoCertificadoNeto(c)/t*100) : 0; }
function itemAcumulado(c, itemId){ return c.certificaciones.reduce((s,ce)=>s+(ce.detalle[itemId]||0),0); }
function contratoPendientePago(c){ return c.certificaciones.filter(ce=>ce.estado_pago!=='Pagado').reduce((s,ce)=>s+certMontoTotal(c,ce),0); }
function anticipoMonto(c){ return (c.anticipo && c.anticipo.aplica) ? contratoValorConIva(c) * (Number(c.anticipo.porcentaje)||0)/100 : 0; }
function anticipoPendiente(c){ return (c.anticipo && c.anticipo.aplica && c.anticipo.estado_pago!=='Pagado') ? anticipoMonto(c) : 0; }
function contratoTotalPendiente(c){ return contratoPendientePago(c) + anticipoPendiente(c); }
function allPagos(){
  const out = [];
  STATE.obras.forEach(obra=>obra.contratos.forEach(c=>{
    if(c.anticipo && c.anticipo.aplica){
      out.push({
        obra, contrato:c, tipo:'anticipo',
        label:`Anticipo (${c.anticipo.porcentaje}%)`,
        monto: anticipoMonto(c), estado_pago: c.anticipo.estado_pago,
        fecha_pago_programada: c.anticipo.fecha_pago_programada, fecha_pago_real: c.anticipo.fecha_pago_real,
      });
    }
    c.certificaciones.forEach(ce=>{
      out.push({
        obra, contrato:c, tipo:'certificacion', cert:ce,
        label:`Cert. N°${ce.numero}`,
        monto: certMontoTotal(c,ce), estado_pago: ce.estado_pago,
        fecha_pago_programada: ce.fecha_pago_programada, fecha_pago_real: ce.fecha_pago_real,
      });
    });
  }));
  return out;
}

function costosTotales(obra){
  const p = obra.costos.categorias.reduce((s,c)=>s+Number(c.presupuestado||0),0);
  const e = obra.costos.categorias.reduce((s,c)=>s+Number(c.ejecutado||0),0);
  return {presupuestado:p, ejecutado:e, pct: p>0 ? (e/p*100) : 0};
}

function allCertificaciones(){
  // flat list {obra, contrato, cert}
  const out=[];
  for(const obra of STATE.obras){
    for(const c of obra.contratos){
      for(const ce of c.certificaciones){
        out.push({obra, contrato:c, cert:ce});
      }
    }
  }
  return out;
}

function gaugeClass(pct){ return pct>=100 ? 'over' : (pct>=85 ? 'ok' : ''); }

function pillFor(status){
  const map = {Pendiente:'pendiente', Reservado:'reservado', Pagado:'pagado', Activo:'activo', Finalizado:'finalizado', Suspendido:'suspendido'};
  return map[status]||'pendiente';
}

/* =========================================================================

function renderContratos(o, showObraTag){
  if(o.contratos.length===0) return `<div class="empty"><div class="glyph">+</div><p>Sin contratos tercerizados cargados para esta obra.</p></div>`;
  return o.contratos.map(c=>{
    const total = contratoValorConIva(c);
    const avance = contratoAvanceFinanciero(c);
    const pendiente = contratoTotalPendiente(c);
    const open = OPEN_CONTRATO_ID===c.id;
    return `
    <div class="contrato-card">
      <div class="contrato-head" data-toggle-contrato="${c.id}">
        <div>
          <div class="name">${c.proveedor} ${showObraTag?`<span class="small-note">— ${o.obra_nombre} (OT ${o.numero_ot})</span>`:''}</div>
          <div class="rubro">${c.rubro} · ${c.referencia||''}</div>

        <div style="display:flex;align-items:center;gap:18px;">

            <div class="mono" style="font-size:13px;font-weight:600;">${fmtGs(total)}</div>

function monthLabel(m,y){
  const names=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return names[m]+' '+y;
}

function renderCalendar(){
  const first = new Date(CAL_YEAR, CAL_MONTH, 1);
  const startDow = first.getDay(); // 0=domingo
  const daysInMonth = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  const all = allPagos().filter(x=>x.fecha_pago_programada);

  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(`<div class="cal-cell empty"></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === TODAY.toISOString().slice(0,10);
    const pays = all.filter(x=>x.fecha_pago_programada===dateStr);
    cells.push(`
      <div class="cal-cell ${isToday?'today':''}">
        <div class="dnum">${d}</div>
        ${pays.map(x=>`<div class="cal-pay ${x.estado_pago.toLowerCase()}" title="${x.contrato.proveedor} — ${x.label} — ${fmtGs(x.monto)}">${x.contrato.proveedor}${x.tipo==='anticipo'?' (ant.)':''}</div>`).join('')}
      </div>`);
  }
  return `
  <div class="cal-grid">
    ${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.join('')}
  </div>
  `;
}

function exportCSV(){
  const rows = [['Obra','OT','Proveedor','Concepto','Fecha','Monto','Estado','Fecha Pago Programada']];
  allPagos().forEach(x=>{
    rows.push([
      x.obra.obra_nombre, x.obra.numero_ot, x.contrato.proveedor, x.label,
      x.tipo==='certificacion' ? x.cert.fecha : '',
      Math.round(x.monto), x.estado_pago, x.fecha_pago_programada||''
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'reserva_pagos_tercerizados.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================================
   IMPORTACIÓN DE ARCHIVOS (Apertura PDF + Costos Excel + Cronograma Excel)
   ========================================================================= */
function ddmmyyyyToISO(s){
  const m = String(s||'').match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(!m) return '';
  let [,d,mo,y]=m; if(y.length===2) y='20'+y;
  return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function excelDateToISO(v){
  if(v==null) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number'){
    const d = new Date(Math.round((v-25569)*86400*1000));
    return isNaN(d) ? '' : d.toISOString().slice(0,10);
  }
  if(typeof v === 'string') return ddmmyyyyToISO(v);
  return '';
}
function scanLabelValue(rows, labelRegex){
  for(const row of rows){
    for(let i=0;i<row.length;i++){
      const cell = row[i];
      if(cell!=null && labelRegex.test(String(cell).trim())){
        for(let j=i+1;j<row.length;j++){
          if(row[j]!=null && String(row[j]).trim()!=='') return row[j];
        }
      }
    }
  }
  return null;
}

/* ---- Excel: planilla de costos de obra ---- */
function parseCostosWorkbook(wb){
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
  const headerIdx = rows.findIndex(r => r.some(c => String(c||'').trim().toLowerCase()==='item'));
  if(headerIdx===-1) throw new Error('no se encontró la fila de encabezados (columna "Item")');
  const dataRow = rows[headerIdx+1];
  if(!dataRow) throw new Error('no hay datos debajo del encabezado');
  const num = v => typeof v==='number' ? v : (parseFloat(String(v||'0').replace(/\./g,'').replace(',','.'))||0);
  const col = i => dataRow[i];
  const categorias = [];
  [[4,21,'Cobertura - Chapas'],[5,22,'Transporte a Obra'],[6,23,'Grúa'],[7,24,'Otras Máquinas'],
   [8,25,'Mano de Obra Montaje'],[9,26,'Insumos en Obra'],[10,27,'Steel Deck'],[11,28,'Gastos de Obra'],
   [13,29,'Costo Indirecto de Obra']].forEach(([p,e,nombre])=>{
    categorias.push({id:uid('c'), nombre, presupuestado:num(col(p)), ejecutado:num(col(e))});
  });
  [[14,30,15],[16,31,17],[18,32,19]].forEach(([p,e,obsIdx],i)=>{
    const pres = num(col(p)), ejec = num(col(e));
    if(pres || ejec){
      const obs = col(obsIdx);
      categorias.push({id:uid('c'), nombre:`Otros ${i+1}${obs?' — '+obs:''}`, presupuestado:pres, ejecutado:ejec});
    }
  });
  return { numero_ot: col(2)!=null ? String(col(2)) : '', obra_nombre: col(3) || '', categorias };
}

/* ---- Excel: cronograma / panel de cumplimiento ---- */
function parseCronogramaWorkbook(wb){
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null});
  return {
    numero_ot: (()=>{ const v = scanLabelValue(rows, /^ot:?$/i); return v!=null ? String(v) : ''; })(),
    obra_nombre: scanLabelValue(rows, /^proyecto:?$/i) || '',
    supervisor: scanLabelValue(rows, /^supervisor:?$/i) || '',
    fecha_inicio: excelDateToISO(scanLabelValue(rows, /^inicio\s*obra:?$/i)),
    fecha_fin: excelDateToISO(scanLabelValue(rows, /^fin\s*obra:?$/i)),
  };
}

/* ---- PDF: apertura de OT ---- */
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text = '';
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = {};
    content.items.forEach(it=>{
      const key = Math.round(it.transform[5]/2)*2;
      (lines[key] = lines[key]||[]).push({str:it.str, x:it.transform[4]});
    });
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{
      text += lines[y].sort((a,b)=>a.x-b.x).map(it=>it.str).join(' ') + '\n';
    });
    text += '\n';
  }
  return text;
}
function parseAperturaPdfText(text){
  const grab = re => { const m = text.match(re); return m ? m[1].trim() : ''; };
  const numero_ot = grab(/Nro\.?\s*OT:?\s*([\d.\s]+)/i).replace(/[\s.]/g,'');
  const presupuesto_n = grab(/Presup\.?\s*N[º°o]\.?:?\s*([^\n]+)/i);
  const cliente = grab(/Cliente:?\s*([^\n]+)/i);
  const obra_nombre = grab(/Nombre de la Obra:?\s*([^\n]+)/i);
  const ubicacion = grab(/Ubicaci[oó]n de la Obra:?\s*([^\n]+)/i);
  const vendedor = grab(/Vendedor:?\s*([^\n]+)/i);
  const fecha_apertura = ddmmyyyyToISO(grab(/Fec\.?\s*Apertura:?\s*([\d\/]+)/i));

  const items = [];
  const re = /(\d{1,2})\s+(\d{4,6})\s+(.{4,90}?)\s+(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s+(m²|m2|ml|unid\.?|gl|kg)\b/gi;
  let m;
  while((m = re.exec(text)) !== null){
    const cantidad = parseFloat(m[4].replace(/\./g,'').replace(',','.'));
    if(isNaN(cantidad)) continue;
    let unidad = m[5].toLowerCase().replace('²','2').replace('.','');
    items.push({id:uid('iv'), descripcion:m[3].trim(), cantidad, unidad});
  }
  return {numero_ot, presupuesto_n, cliente, obra_nombre, ubicacion, vendedor, fecha_apertura, items};
}

async function procesarImportacion(){
  const errBox = document.getElementById('importError');
  errBox.style.display='none'; errBox.textContent='';
  const pdfFile = document.getElementById('imp_pdf').files[0];
  const costosFile = document.getElementById('imp_costos').files[0];
  const cronoFile = document.getElementById('imp_crono').files[0];
  if(!pdfFile && !costosFile && !cronoFile){ showToast('Subí al menos un archivo'); return; }

  const btn = document.getElementById('btnProcesarImport');
  const originalLabel = btn.textContent;
  btn.textContent='Procesando…'; btn.disabled=true;

  let pdfData={}, costosData={}, cronoData={};
  const errores=[];

  try{
    if(pdfFile){
      if(typeof pdfjsLib==='undefined') throw new Error('no se pudo cargar el lector de PDF (revisá tu conexión)');
      pdfData = parseAperturaPdfText(await extractPdfText(pdfFile));
    }
  }catch(e){ errores.push('Apertura de OT (PDF): ' + (e.message||e)); }

  try{
    if(costosFile){
      if(typeof XLSX==='undefined') throw new Error('no se pudo cargar el lector de Excel (revisá tu conexión)');
      const wb = XLSX.read(await costosFile.arrayBuffer(), {type:'array', cellDates:true});
      costosData = parseCostosWorkbook(wb);
    }
  }catch(e){ errores.push('Planilla de costos: ' + (e.message||e) + '. Si el archivo es .xls antiguo, probá abrirlo en Excel/LibreOffice y guardarlo como .xlsx.'); }

  try{
    if(cronoFile){
      if(typeof XLSX==='undefined') throw new Error('no se pudo cargar el lector de Excel (revisá tu conexión)');
      const wb = XLSX.read(await cronoFile.arrayBuffer(), {type:'array', cellDates:true});
      cronoData = parseCronogramaWorkbook(wb);
    }
  }catch(e){ errores.push('Cronograma: ' + (e.message||e)); }

  btn.textContent = originalLabel; btn.disabled=false;

  IMPORT_DRAFT = {
    numero_ot: pdfData.numero_ot || costosData.numero_ot || cronoData.numero_ot || '',
    presupuesto_n: pdfData.presupuesto_n || '',
    cliente: pdfData.cliente || '',
    obra_nombre: pdfData.obra_nombre || costosData.obra_nombre || cronoData.obra_nombre || '',
    ubicacion: pdfData.ubicacion || '',
    vendedor: pdfData.vendedor || '',
    supervisor: cronoData.supervisor || '',
    fecha_apertura: pdfData.fecha_apertura || '',
    fecha_inicio_montaje: cronoData.fecha_inicio || '',
    fecha_fin_prevista: cronoData.fecha_fin || '',
    items_venta: pdfData.items || [],
    costos_categorias: costosData.categorias || [],
  };

  if(errores.length){
    errBox.style.display='block';
    errBox.innerHTML = errores.map(e=>'⚠ '+e).join('<br>');
  }
  renderImportReview();
}

function confirmarImportacion(){
  const val = id => document.getElementById(id).value.trim();
  const items_venta = Array.from(document.querySelectorAll('.imp-item-row')).map(row=>({
    id: row.dataset.id, descripcion: row.querySelector('.ii-desc').value.trim(),
    cantidad: parseFloat(row.querySelector('.ii-cant').value)||0, unidad: row.querySelector('.ii-unid').value
  })).filter(it=>it.descripcion);
  const categorias = Array.from(document.querySelectorAll('.imp-costo-row')).map(row=>({
    id: row.dataset.id, nombre: row.querySelector('.ic-nombre').value.trim(),
    presupuestado: parseFloat(row.querySelector('.ic-presu').value)||0, ejecutado: parseFloat(row.querySelector('.ic-ejec').value)||0
  })).filter(c=>c.nombre);

  const nombre = val('r_nombre');
  if(!nombre){ showToast('Ingresá el nombre de la obra'); return; }

  const numero_ot = val('r_ot');
  const existing = numero_ot ? STATE.obras.find(o=>o.numero_ot===numero_ot) : null;
  if(existing && !confirm(`Ya existe una obra con OT ${numero_ot} (${existing.obra_nombre}). ¿Actualizar sus datos generales, ítems y presupuesto de costos con lo importado? (los contratos tercerizados que ya tenga cargados no se tocan)`)) return;

  const data = {
    numero_ot, presupuesto_n: val('r_presu'), cliente: val('r_cliente'), obra_nombre: nombre,
    ubicacion: val('r_ubic'), vendedor: val('r_vend'), supervisor: val('r_sup'),
    fecha_inicio_montaje: val('r_ini'), fecha_fin_prevista: val('r_fin'),
  };

  let obraId;
  if(existing){
    Object.assign(existing, data);
    existing.items_venta = items_venta;
    existing.costos.categorias = categorias;
    obraId = existing.id;
  } else {
    obraId = uid('ot');
    STATE.obras.push({
      id: obraId, ...data, fecha_apertura: IMPORT_DRAFT.fecha_apertura || new Date().toISOString().slice(0,10),
      items_venta, costos:{categorias}, contratos: []
    });
  }
  closeModal();
  ACTIVE_OBRA_ID = obraId; ACTIVE_TAB='obras'; OPEN_CONTRATO_ID=null;
  persist();
  showToast(existing ? 'Obra actualizada desde los archivos importados' : 'Obra creada desde los archivos importados');
}

        <div class="field"><label>Fecha fin ejecución</label><input id="f_fin" type="date" value="${c?c.fecha_fin||'':''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Estado</label>
          <select id="f_estado">
            <option ${c&&c.estado==='Activo'?'selected':''}>Activo</option>
            <option ${c&&c.estado==='Finalizado'?'selected':''}>Finalizado</option>
            <option ${c&&c.estado==='Suspendido'?'selected':''}>Suspendido</option>
          </select>
        </div>
        <div class="field"><label>IVA (%)</label><input id="f_iva" type="number" value="${c?c.iva_pct:10}"></div>
      </div>
      <div class="divider"></div>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px;margin-bottom:10px;">
        <input type="checkbox" id="f_anticipo_aplica" ${c&&c.anticipo&&c.anticipo.aplica?'checked':''} style="width:16px;height:16px;">
        <label style="margin-bottom:0;">¿Se le da anticipo a este proveedor?</label>
      </div>
      <div id="anticipoFields" class="field-row" style="display:${c&&c.anticipo&&c.anticipo.aplica?'flex':'none'};">
        <div class="field"><label>% de anticipo</label><input id="f_anticipo_pct" type="number" min="0" max="100" value="${c&&c.anticipo?c.anticipo.porcentaje:30}"></div>
        <div class="field"><label>Fecha de pago programada</label><input id="f_anticipo_fecha" type="date" value="${c&&c.anticipo?c.anticipo.fecha_pago_programada||'':''}"></div>
      </div>
      <div class="divider"></div>
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-soft);">Ítems del contrato (por m² o kg según corresponda)</label>
      <div id="itemsWrap">
        ${(c?c.items:[{id:uid('it'),descripcion:'',unidad:'m2',cantidad:'',precio_unitario:''}]).map(it=>itemRow(it)).join('')}
      </div>
      <button class="link-btn" id="addItemRowBtn" style="margin-top:8px;">+ Agregar ítem</button>
    </div>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary" data-action="save-contrato" data-obra="${obraId}" data-id="${c?c.id:''}">Guardar contrato</button>
    </div>
  `, true);
  document.getElementById('addItemRowBtn').addEventListener('click', ()=>{
    document.getElementById('itemsWrap').insertAdjacentHTML('beforeend', itemRow({id:uid('it'),descripcion:'',unidad:'m2',cantidad:'',precio_unitario:''}));
  });
  document.getElementById('f_anticipo_aplica').addEventListener('change', function(){
    document.getElementById('anticipoFields').style.display = this.checked ? 'flex' : 'none';
  });
}
function itemRow(it){
  return `
  <div class="field-row item-row" data-item-id="${it.id}" style="align-items:flex-end;">
    <div class="field" style="flex:2;"><label>Descripción</label><input class="it-desc" value="${it.descripcion}"></div>
    <div class="field" style="flex:1;"><label>Unidad</label>
      <select class="it-unid">
        <option value="m2" ${it.unidad==='m2'?'selected':''}>m2</option>
        <option value="kg" ${it.unidad==='kg'?'selected':''}>kg</option>
        <option value="ml" ${it.unidad==='ml'?'selected':''}>ml</option>
        <option value="unid" ${it.unidad==='unid'?'selected':''}>unid</option>
        <option value="gl" ${it.unidad==='gl'?'selected':''}>gl</option>
      </select>
    </div>
    <div class="field" style="flex:1;"><label>Cantidad</label><input class="it-cant" type="number" step="0.01" value="${it.cantidad}"></div>
    <div class="field" style="flex:1;"><label>Precio unit. (Gs.)</label><input class="it-precio" type="number" value="${it.precio_unitario}"></div>
    <button class="icon-btn" style="margin-bottom:12px;" onclick="this.closest('.item-row').remove()">×</button>
  </div>`;
}

function modalNewCert(obraId, contratoId){
  const o = findObra(obraId); const c = findContrato(o, contratoId);
  return openModal(`
    <div class="modal-head"><h3>Registrar certificación</h3><button class="x-close" data-action="close-modal">×</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>N° de certificación</label><input id="f_num" type="number" value="${c.certificaciones.length+1}"></div>
        <div class="field"><label>Fecha de certificación</label><input id="f_fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink-soft);">Cantidad certificada por ítem</label>
      <div style="margin:8px 0 4px;">
      ${c.items.map(it=>{
        const acum = itemAcumulado(c,it.id);
        const disponible = it.cantidad - acum;
        return `
        <div class="field-row" style="align-items:center;margin-bottom:8px;">
          <div style="flex:2;font-size:12.5px;">${it.descripcion}<div class="small-note">Disponible: ${fmtNum(disponible)} ${it.unidad}</div></div>
          <div class="field" style="flex:1;margin-bottom:0;"><input class="cert-item-qty" data-item="${it.id}" type="number" step="0.01" placeholder="0"></div>
        </div>`;
      }).join('')}
      </div>
      <div class="divider"></div>
      <div class="field-row">
        <div class="field"><label>Estado de pago</label>
          <select id="f_estado"><option>Pendiente</option><option>Reservado</option><option>Pagado</option></select>
        </div>
        <div class="field"><label>Fecha de pago programada</label><input id="f_fechapago" type="date"></div>
      </div>
      <div class="field"><label>Observación</label><textarea id="f_obs" rows="2"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary" data-action="save-cert" data-obra="${obraId}" data-contrato="${contratoId}">Guardar certificación</button>
    </div>
  `, true);
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
function bindGlobalEvents(){
  document.querySelectorAll('[data-open-obra]').forEach(el=>{
    el.addEventListener('click', ()=>{ ACTIVE_OBRA_ID = el.dataset.openObra; ACTIVE_TAB='obras'; OPEN_CONTRATO_ID=null; render(); });
  });
  const backBtn = document.querySelector('[data-action="back-obras"]');
  if(backBtn) backBtn.addEventListener('click', ()=>{ ACTIVE_OBRA_ID=null; render(); });

  const newObraBtn = document.querySelector('[data-action="new-obra"]');
  if(newObraBtn) newObraBtn.addEventListener('click', modalNewObra);
  const importBtn = document.querySelector('[data-action="import-ot"]');
  if(importBtn) importBtn.addEventListener('click', modalImportarOT);

  document.querySelectorAll('[data-action="edit-obra"]').forEach(el=>el.addEventListener('click', ()=>modalEditObra(el.dataset.id)));
  document.querySelectorAll('[data-action="add-item-venta"]').forEach(el=>el.addEventListener('click', ()=>modalAddItemVenta(el.dataset.id)));
  document.querySelectorAll('[data-action="add-costo"]').forEach(el=>el.addEventListener('click', ()=>modalAddCosto(el.dataset.id)));
  document.querySelectorAll('[data-action="new-contrato"]').forEach(el=>el.addEventListener('click', ()=>modalNewContrato(el.dataset.id)));

  document.querySelectorAll('[data-action="del-item-venta"]').forEach(el=>el.addEventListener('click', ()=>{
    const o = findObra(el.dataset.id); o.items_venta = o.items_venta.filter(i=>i.id!==el.dataset.item); persist();
  }));
  document.querySelectorAll('[data-action="del-costo"]').forEach(el=>el.addEventListener('click', ()=>{
    const o = findObra(el.dataset.id); o.costos.categorias = o.costos.categorias.filter(c=>c.id!==el.dataset.cat); persist();
  }));
  document.querySelectorAll('[data-action="edit-costo"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const o = findObra(el.dataset.id); const cat = o.costos.categorias.find(c=>c.id===el.dataset.cat);
      cat[el.dataset.field] = parseFloat(el.value)||0; persist();
    });
  });

  document.querySelectorAll('[data-toggle-contrato]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggleContrato;
      OPEN_CONTRATO_ID = OPEN_CONTRATO_ID===id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-action="edit-contrato"]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();modalNewContrato(el.dataset.obra, el.dataset.id);}));
  document.querySelectorAll('[data-action="del-contrato"]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(!confirm('¿Eliminar este contrato y todas sus certificaciones?')) return;
    const o = findObra(el.dataset.obra); o.contratos = o.contratos.filter(c=>c.id!==el.dataset.id); OPEN_CONTRATO_ID=null; persist();
  }));
  document.querySelectorAll('[data-action="new-cert"]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();modalNewCert(el.dataset.obra, el.dataset.contrato);}));
  document.querySelectorAll('[data-action="del-cert"]').forEach(el=>el.addEventListener('click', ()=>{
    const o = findObra(el.dataset.obra); const c = findContrato(o, el.dataset.contrato);
    c.certificaciones = c.certificaciones.filter(ce=>ce.id!==el.dataset.cert); persist();
  }));
  document.querySelectorAll('[data-action="cert-estado"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const o = findObra(el.dataset.obra); const c = findContrato(o, el.dataset.contrato);
      const ce = c.certificaciones.find(x=>x.id===el.dataset.cert);
      ce.estado_pago = el.value;
      if(el.value==='Pagado' && !ce.fecha_pago_real) ce.fecha_pago_real = new Date().toISOString().slice(0,10);
      persist();
      showToast('Estado de pago actualizado');
    });
  });
  document.querySelectorAll('[data-action="anticipo-estado"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const o = findObra(el.dataset.obra); const c = findContrato(o, el.dataset.contrato);
      c.anticipo.estado_pago = el.value;
      if(el.value==='Pagado' && !c.anticipo.fecha_pago_real) c.anticipo.fecha_pago_real = new Date().toISOString().slice(0,10);
      persist();
      showToast('Estado del anticipo actualizado');
    });
  });

  const filtro = document.getElementById('filtroTercerizado');
  if(filtro){
    filtro.addEventListener('input', ()=>{ render(); document.getElementById('filtroTercerizado').focus(); });
    filtro.addEventListener('focus', function(){ this.setSelectionRange(this.value.length, this.value.length); });
  }

  const calPrev = document.querySelector('[data-action="cal-prev"]');
  if(calPrev) calPrev.addEventListener('click', ()=>{ CAL_MONTH--; if(CAL_MONTH<0){CAL_MONTH=11;CAL_YEAR--;} render(); });
  const calNext = document.querySelector('[data-action="cal-next"]');
  if(calNext) calNext.addEventListener('click', ()=>{ CAL_MONTH++; if(CAL_MONTH>11){CAL_MONTH=0;CAL_YEAR++;} render(); });

  const exportBtn = document.querySelector('[data-action="export-csv"]');
  if(exportBtn) exportBtn.addEventListener('click', exportCSV);

  document.getElementById('resetBtn').onclick = async ()=>{
    if(!confirm('Esto restaura los datos de ejemplo y borra los cambios actuales. ¿Continuar?')) return;
    STATE = seedData(); ACTIVE_OBRA_ID=null; OPEN_CONTRATO_ID=null;
    await saveState(); render(); showToast('Datos reiniciados');
  };
  document.getElementById('refreshBtn').onclick = manualRefresh;
}

function bindModalEvents(){
  const root = document.getElementById('modalRoot');
  if(!root) return;
  root.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.addEventListener('click', closeModal));

  const saveNewObra = root.querySelector('[data-action="save-new-obra"]');
  if(saveNewObra) saveNewObra.addEventListener('click', ()=>{
    const val = id => document.getElementById(id).value.trim();
    if(!val('f_nombre')){ showToast('Ingresá el nombre de la obra'); return; }
    STATE.obras.push({
      id: uid('ot'),
      numero_ot: val('f_ot'), presupuesto_n: val('f_presu'), cliente: val('f_cliente'),
      obra_nombre: val('f_nombre'), ubicacion: val('f_ubic'), vendedor: val('f_vend'), supervisor: val('f_sup'),
      fecha_apertura: new Date().toISOString().slice(0,10),
      fecha_inicio_montaje: val('f_ini'), fecha_fin_prevista: val('f_fin'),
      items_venta: [], costos:{categorias:[]}, contratos: []
    });
    closeModal(); persist(); showToast('Obra creada');
  });

  const saveEditObra = root.querySelector('[data-action="save-edit-obra"]');
  if(saveEditObra) saveEditObra.addEventListener('click', ()=>{
    const o = findObra(saveEditObra.dataset.id);
    const val = id => document.getElementById(id).value.trim();
    Object.assign(o, {
      numero_ot: val('f_ot'), presupuesto_n: val('f_presu'), cliente: val('f_cliente'), obra_nombre: val('f_nombre'),
      ubicacion: val('f_ubic'), vendedor: val('f_vend'), supervisor: val('f_sup'),
      fecha_inicio_montaje: val('f_ini'), fecha_fin_prevista: val('f_fin')
    });
    closeModal(); persist(); showToast('Obra actualizada');
  });

  const delObra = root.querySelector('[data-action="delete-obra"]');
  if(delObra) delObra.addEventListener('click', ()=>{
    if(!confirm('¿Eliminar esta obra y todos sus contratos?')) return;
    STATE.obras = STATE.obras.filter(o=>o.id!==delObra.dataset.id);
    ACTIVE_OBRA_ID = null; closeModal(); persist(); showToast('Obra eliminada');
  });

  const saveItemVenta = root.querySelector('[data-action="save-item-venta"]');
  if(saveItemVenta) saveItemVenta.addEventListener('click', ()=>{
    const o = findObra(saveItemVenta.dataset.id);
    const desc = document.getElementById('f_desc').value.trim();
    const cant = parseFloat(document.getElementById('f_cant').value)||0;
    const unid = document.getElementById('f_unid').value;
    if(!desc){ showToast('Ingresá una descripción'); return; }
    o.items_venta.push({id:uid('iv'), descripcion:desc, cantidad:cant, unidad:unid});
    closeModal(); persist(); showToast('Ítem agregado');
  });

  const saveCosto = root.querySelector('[data-action="save-costo"]');
  if(saveCosto) saveCosto.addEventListener('click', ()=>{
    const o = findObra(saveCosto.dataset.id);
    const nombre = document.getElementById('f_nombre').value.trim();
    if(!nombre){ showToast('Ingresá un nombre'); return; }
    o.costos.categorias.push({id:uid('c'), nombre, presupuestado: parseFloat(document.getElementById('f_presu').value)||0, ejecutado: parseFloat(document.getElementById('f_ejec').value)||0});
    closeModal(); persist(); showToast('Categoría agregada');
  });

  const saveContrato = root.querySelector('[data-action="save-contrato"]');
  if(saveContrato) saveContrato.addEventListener('click', ()=>{
    const obraId = saveContrato.dataset.obra; const editId = saveContrato.dataset.id;
    const o = findObra(obraId);
    const items = Array.from(root.querySelectorAll('.item-row')).map(row=>({
      id: row.dataset.itemId,
      descripcion: row.querySelector('.it-desc').value.trim(),
      unidad: row.querySelector('.it-unid').value,
      cantidad: parseFloat(row.querySelector('.it-cant').value)||0,
      precio_unitario: parseFloat(row.querySelector('.it-precio').value)||0,
    })).filter(it=>it.descripcion);
    const proveedor = document.getElementById('f_prov').value.trim();
    if(!proveedor || items.length===0){ showToast('Completá proveedor y al menos un ítem'); return; }
    const existing = editId ? findContrato(o, editId) : null;
    const aplicaAnticipo = document.getElementById('f_anticipo_aplica').checked;
    const anticipo = aplicaAnticipo ? {
      aplica: true,
      porcentaje: parseFloat(document.getElementById('f_anticipo_pct').value)||0,
      fecha_pago_programada: document.getElementById('f_anticipo_fecha').value || null,
      estado_pago: (existing && existing.anticipo) ? existing.anticipo.estado_pago : 'Pendiente',
      fecha_pago_real: (existing && existing.anticipo) ? existing.anticipo.fecha_pago_real : null,
    } : { aplica:false, porcentaje:0, fecha_pago_programada:null, estado_pago:'Pendiente', fecha_pago_real:null };
    const data = {
      proveedor, referencia: document.getElementById('f_ref').value.trim(),
      rubro: document.getElementById('f_rubro').value.trim(),
      fecha_inicio: document.getElementById('f_ini').value, fecha_fin: document.getElementById('f_fin').value,
      estado: document.getElementById('f_estado').value, iva_pct: parseFloat(document.getElementById('f_iva').value)||0,
      anticipo, items
    };
    if(editId){
      Object.assign(existing, data);
    } else {
      o.contratos.push({id:uid('ct'), certificaciones:[], ...data});
    }
    closeModal(); persist(); showToast('Contrato guardado');
  });

  const saveCert = root.querySelector('[data-action="save-cert"]');
  if(saveCert) saveCert.addEventListener('click', ()=>{
    const o = findObra(saveCert.dataset.obra); const c = findContrato(o, saveCert.dataset.contrato);
    const detalle = {};
    root.querySelectorAll('.cert-item-qty').forEach(inp=>{
      const q = parseFloat(inp.value)||0;
      if(q>0) detalle[inp.dataset.item] = q;
    });
    if(Object.keys(detalle).length===0){ showToast('Ingresá al menos una cantidad certificada'); return; }
    c.certificaciones.push({
      id: uid('ce'), numero: parseInt(document.getElementById('f_num').value)||c.certificaciones.length+1,
      fecha: document.getElementById('f_fecha').value, detalle,
      estado_pago: document.getElementById('f_estado').value,
      fecha_pago_programada: document.getElementById('f_fechapago').value || null,
      fecha_pago_real: null, observacion: document.getElementById('f_obs').value.trim()
    });
    closeModal(); persist(); showToast('Certificación registrada');
  });
}

/* =========================================================================
   ACCESO (PIN simple compartido — solo activo si APP_PIN no está vacío)
   ========================================================================= */
function checkPin(){
  if(!APP_PIN) return true;
  try{ if(sessionStorage.getItem('mv_unlocked')==='1') return true; }catch(e){}
  return false;
}
function showPinGate(){
  const gate = document.createElement('div');
  gate.id='pinGate';
  gate.style.cssText='position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:500;font-family:"Work Sans",sans-serif;';
  gate.innerHTML = `
    <div style="background:#fff;border:1px solid var(--line);border-radius:4px;padding:28px 30px;max-width:320px;width:90%;box-shadow:var(--shadow);text-align:center;">
      <div style="width:40px;height:40px;border:2px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent);margin:0 auto 14px;">MV</div>
      <h3 style="margin-bottom:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;">Control Tercerizados</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">Ingresá la clave del equipo para continuar</p>
      <input id="pinInput" type="password" inputmode="numeric" style="width:100%;text-align:center;font-size:18px;letter-spacing:3px;padding:10px;border:1px solid var(--line);border-radius:3px;margin-bottom:10px;box-sizing:border-box;" placeholder="••••">
      <div id="pinError" style="color:var(--oxide);font-size:12px;margin-bottom:10px;display:none;">Clave incorrecta</div>
      <button id="pinSubmit" class="btn btn-primary" style="width:100%;">Entrar</button>
    </div>`;
  document.body.appendChild(gate);
  const submit = ()=>{
    const val = document.getElementById('pinInput').value;
    if(val === APP_PIN){
      try{ sessionStorage.setItem('mv_unlocked','1'); }catch(e){}
      gate.remove();
      init();
    } else {
      document.getElementById('pinError').style.display='block';
    }
  };
  document.getElementById('pinSubmit').addEventListener('click', submit);
  document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('pinInput').focus();
}

/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  await loadState();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  tickClock(); setInterval(tickClock, 60000);
  render();
  startPolling();
}
if(checkPin()){ init(); } else { document.getElementById('loading').style.display='none'; showPinGate(); }
</script>
